[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "swkit"
version = "0.1.0"
description = "SOLIDWORKS を Python から操作して、後から直せるモデル（完全定義スケッチ・関係式・穴ウィザード・合致）を作るライブラリ"
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["pywin32; sys_platform == 'win32'"]

[tool.setuptools.packages.find]
where = ["src"]
