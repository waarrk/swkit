[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "swkit"
version = "0.1.0"
description = "SOLIDWORKS を Python から操作して、後から直せるモデル（完全定義スケッチ・関係式・穴ウィザード・合致）を作るライブラリ"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
dependencies = ["pywin32; sys_platform == 'win32'"]

[project.optional-dependencies]
rapid = ["pywinauto", "pillow"]       # MISUMI RAPiD Design からの取り込み（画面操作）
doc = ["python-docx"]                 # 正式文書（Word・PDF）の生成。PDF は Word で書き出す

[project.scripts]
swkit = "swkit.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
swkit = ["templates/**/*", "templates/**/.*"]
